version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: mediguard_postgres
    environment:
      POSTGRES_USER: mediguard
      POSTGRES_PASSWORD: mediguard_secret
      POSTGRES_DB: mediguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mediguard_redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mediguard_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    container_name: mediguard_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Override only the infra URLs that are specific to this compose network.
    # DATABASE_URL is intentionally NOT overridden here — it comes from
    # backend/.env so Supabase is used consistently in both local and prod.
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - postgres
      - redis
      - qdrant
    # No volume mount — use the image built by `docker compose build`.
    # A bind mount would overwrite the image and bypass the build step.

  frontend:
    build: ./frontend
    container_name: mediguard_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # No bind mount — use the image built by `docker compose build`.

volumes:
  postgres_data:
  qdrant_data:
