version: '3.9'

# Production compose — Supabase is the database, no local Postgres container.
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required before running:
#   backend/.env        — DATABASE_URL, SECRET_KEY, OPENAI_API_KEY, etc.
#   Build args below    — set NEXT_PUBLIC_* to your actual values or export
#                         them as shell env vars before running compose.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Override these at build time:
        #   NEXT_PUBLIC_API_URL=https://api.yourdomain.com \
        #   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_live_... \
        #   docker compose -f docker-compose.prod.yml up -d --build
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    container_name: mediguard_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
